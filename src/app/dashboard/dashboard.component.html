<div class="container-fluid py-4">
    <div class="row g-4">

        <!-- Card 1 -->
        <div class="col-xl-3 col-lg-6 col-md-6">
            <mat-card class="dashboard-card primary">

                <div class="d-flex justify-content-between align-items-start">

                    <div>
                        <div class="card-title">Total Users</div>
                        <h2 class="card-value">18,245</h2>

                        <div class="card-info text-success">
                            <i class="bi bi-arrow-up"></i> +12% this month
                        </div>
                    </div>

                    <div class="icon-box">
                        <i class="bi bi-people-fill"></i>
                    </div>

                </div>

            </mat-card>
        </div>

        <!-- Card 2 -->
        <div class="col-xl-3 col-lg-6 col-md-6">
            <mat-card class="dashboard-card success">

                <div class="d-flex justify-content-between align-items-start">

                    <div>
                        <div class="card-title">Revenue</div>
                        <h2 class="card-value">$48,200</h2>

                        <div class="card-info text-success">
                            <i class="bi bi-arrow-up"></i> +8.4%
                        </div>
                    </div>

                    <div class="icon-box">
                        <i class="bi bi-cash-stack"></i>
                    </div>

                </div>

            </mat-card>
        </div>

        <!-- Card 3 -->
        <div class="col-xl-3 col-lg-6 col-md-6">
            <mat-card class="dashboard-card warning">

                <div class="d-flex justify-content-between align-items-start">

                    <div>
                        <div class="card-title">Orders</div>
                        <h2 class="card-value">2,354</h2>

                        <div class="card-info text-primary">
                            <i class="bi bi-clock"></i> Today
                        </div>
                    </div>

                    <div class="icon-box">
                        <i class="bi bi-cart-check-fill"></i>
                    </div>

                </div>

            </mat-card>
        </div>

        <!-- Card 4 -->
        <div class="col-xl-3 col-lg-6 col-md-6">
            <mat-card class="dashboard-card danger">

                <div class="d-flex justify-content-between align-items-start">

                    <div>
                        <div class="card-title">Pending Tasks</div>
                        <h2 class="card-value">42</h2>

                        <div class="card-info text-danger">
                            <i class="bi bi-exclamation-circle"></i> Needs attention
                        </div>
                    </div>

                    <div class="icon-box">
                        <i class="bi bi-list-task"></i>
                    </div>

                </div>

            </mat-card>
        </div>

    </div>
</div>

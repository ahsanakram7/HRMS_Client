<div class="login-wrapper" *ngIf="!signUpVisible">
    <div class="card login-card p-4">
  
      <div class="text-center mb-4">
        <h2 class="fw-bold">Welcome Back</h2>
        <p>Login to continue</p>
      </div>
  
      <form>
  
        <div class="mb-3 position-relative">
          <i class="bi bi-envelope-fill input-icon"></i>
          <input
            type="text"
            class="form-control"
            placeholder="UserName"
            [(ngModel)]="loginModal.userName"
            name="userName">
          <p class="text-danger" *ngIf="inValidUserName!=''">{{ inValidUserName }}</p>
        </div>
  
        <div class="mb-3 position-relative">
          <i class="bi bi-lock-fill input-icon"></i>
          <input
            type="password"
            class="form-control"
            placeholder="Password"
            [(ngModel)]="loginModal.password"
            name="password">
          <p class="text-danger" *ngIf="inValidPassword!=''">{{ inValidPassword }}</p>
        </div>
  
        <div class="d-flex justify-content-between mb-3">
  
          <div class="form-check">
            <input class="form-check-input" type="checkbox">
            <label class="form-check-label">
              Remember Me
            </label>
          </div>
  
          <a href="#">Forgot Password?</a>
  
        </div>
  
        <button class="btn btn-light w-100 btn-login" (click)="login()">
          Login
        </button>

  
        <div class="text-center mt-4">
          Don't have an account?
          <a (click)="signUpShow()">Register</a>
        </div>
  
      </form>
  
    </div>
  </div>

  <div class="signup-wrapper" *ngIf="signUpVisible">

    <div class="card signup-card p-4">
  
      <div class="text-center mb-4">
        <h2>Create Account</h2>
        <p>Join us today</p>
      </div>
  
      <form>
  
        <div class="mb-3 position-relative">
          <i class="bi bi-person-fill input-icon"></i>
          <input
            type="text"
            class="form-control"
            placeholder="Full Name">
        </div>
  
        <div class="mb-3 position-relative">
          <i class="bi bi-envelope-fill input-icon"></i>
          <input
            type="email"
            class="form-control"
            placeholder="Email Address">
        </div>
  
        <div class="mb-3 position-relative">
          <i class="bi bi-lock-fill input-icon"></i>
          <input
            type="password"
            class="form-control"
            placeholder="Password">
        </div>
  
        <div class="mb-3 position-relative">
          <i class="bi bi-shield-lock-fill input-icon"></i>
          <input
            type="password"
            class="form-control"
            placeholder="Confirm Password">
        </div>
  
        <div class="form-check mb-3">
  
          <input class="form-check-input" type="checkbox">
  
          <label class="form-check-label">
            I agree to the Terms & Conditions
          </label>
  
        </div>
  
        <button class="btn btn-light w-100 btn-register">
          Create Account
        </button>
  
        <div class="text-center mt-4">
          Already have an account?
          <a (click)="LoginShow()">Login</a>
        </div>
  
      </form>
  
    </div>
  
  </div>
